# VideoPrime: compila una APK instalable en cada push a la rama `videoprime`
# y la publica como pre-release "nightly" (descargable desde el móvil sin login).
#
# Firma: si existe el secret VIDEOPRIME_DEBUG_KEYSTORE (keystore en base64 con las
# credenciales estándar de depuración: alias androiddebugkey, contraseñas "android"),
# se usa para que todas las APK compartan firma y se puedan actualizar encima.
# Sin ese secret cada ejecución firma con una clave distinta y hay que desinstalar antes.
name: "VideoPrime: APK"

on:
  workflow_dispatch:
  push:
    branches:
      - videoprime
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "docs/**"
      - "fastlane/**"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: videoprime-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # the extractor fork is built from the NewPipeExtractor/ submodule
          submodules: true

      - uses: actions/setup-java@v5
        with:
          # 17 for the extractor's toolchain, 21 (last = default) for the app
          java-version: |
            17
            21
          distribution: temurin
          cache: gradle

      - name: Clave de firma persistente
        env:
          KEYSTORE_B64: ${{ secrets.VIDEOPRIME_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            # al pegar desde el móvil se cuelan espacios y saltos de línea: se quitan
            if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > ~/.android/debug.keystore \
                || ! keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null; then
              echo "::error::El secret VIDEOPRIME_DEBUG_KEYSTORE no es un keystore válido en base64 (¿se pegó incompleto?). Vuelve a pegar el contenido completo de secret.txt."
              echo "Firma: el secret VIDEOPRIME_DEBUG_KEYSTORE no es válido" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Firma: keystore persistente" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Firma: clave temporal (configura el secret VIDEOPRIME_DEBUG_KEYSTORE)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # avisos instantáneos: la configuración de Firebase y la dirección del servidor de avisos
      # (la de Cloudflare se averigua sola; la variable VIDEOPRIME_PUSH_URL la cambia si hace falta)
      - name: Avisos instantáneos
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUSH_URL: ${{ vars.VIDEOPRIME_PUSH_URL }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "Avisos instantáneos: no (falta el secret FIREBASE_CONFIG)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! printf '%s' "$FIREBASE_CONFIG" | jq -e '.project_info.project_id and .client[0].client_info.mobilesdk_app_id' > /dev/null; then
            echo "::warning::FIREBASE_CONFIG no es un google-services.json válido: la APK sale sin avisos instantáneos."
            exit 0
          fi
          url="$PUSH_URL"
          if [ -z "$url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain // empty')" || sub=""
            [ -n "$sub" ] && url="https://videoprime-push.$sub.workers.dev"
          fi
          if [ -z "$url" ]; then
            echo "::warning::No se sabe la dirección del servidor de avisos: la APK sale sin avisos instantáneos."
            exit 0
          fi
          {
            echo "FIREBASE_CONFIG<<VIDEOPRIME_EOF"
            printf '%s\n' "$FIREBASE_CONFIG"
            echo "VIDEOPRIME_EOF"
            echo "VIDEOPRIME_PUSH_URL=$url"
          } >> "$GITHUB_ENV"
          echo "Avisos instantáneos: sí ($url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar APK
        run: ./gradlew assembleContinuous --stacktrace -DskipFormatKtlint

      - name: Renombrar APK
        id: apk
        run: |
          dir=app/build/outputs/apk/continuous
          version="$(jq -r '.elements[0].versionName' "$dir/output-metadata.json")"
          name="VideoPrime_${version}_$(git rev-parse --short HEAD).apk"
          mv "$dir"/*.apk "$dir/$name"
          echo "path=$dir/$name" >> "$GITHUB_OUTPUT"
          echo "APK: \`$name\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: VideoPrime-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publicar pre-release nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly "${{ steps.apk.outputs.path }}" \
            --prerelease --target "$GITHUB_SHA" --title "VideoPrime nightly" \
            --notes "Compilación automática de \`$(git rev-parse --short HEAD)\` (rama videoprime)."

      # avisa a los móviles con avisos instantáneos de que hay versión nueva (al momento)
      - name: Avisar de la nueva versión
        if: env.VIDEOPRIME_PUSH_URL != ''
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          [ -n "$FCM_SERVICE_ACCOUNT" ] || exit 0
          key="$(node -e 'const a = JSON.parse(process.env.FCM_SERVICE_ACCOUNT);
            process.stdout.write(require("crypto").createHash("sha256").update("videoprime-release:" + a.private_key).digest("hex"))')"
          name="$(basename "$APK_PATH")"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/$name"
          body="$(jq -nc --arg c "$(git rev-parse --short HEAD)" --arg u "$url" '{commit: $c, url: $u}')"
          if curl -fsS -X POST "$VIDEOPRIME_PUSH_URL/release" -H "x-release-key: $key" \
              -H "content-type: application/json" -d "$body"; then
            echo "Aviso de versión nueva enviado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No se pudo avisar de la versión nueva (los móviles la verán en su comprobación)."
          fi
